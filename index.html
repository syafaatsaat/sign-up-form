<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign-up Form</title>

        <link rel="stylesheet" href="./style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" 
        rel="stylesheet">
    </head>

    <body>
        <div id="left-container">
            <div>
                <img src="./images/odin-lined.png" alt="logo" id="logo">
                <p class="norse-font">ODIN</p>
            </div>
            <p>
                Photo by 
                <a href="https://unsplash.com/photos/
                two-stars-in-the-middle-of-a-black-sky-fsH1KjbdjE8">
                    Alexander Andrews</a> on
                <a href="https://unsplash.com/">Unsplash</a>
            </p>
        </div>
        <div id="right-container">
            <p class="description">
                This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
                Sign up <em>now</em> to get started.
            </p>
            <p class="description">
                You <em>know</em> you want to.
            </p>

            <form action="" id="signup">
                <header>
                    <p>Let's do this!</p>
                </header>

                <div class="form-row">
                    <div class="form-col">
                        <label for="first-name">FIRST NAME</label>
                        <input id="first-name" name="first-name" type="text">
                    </div>

                    <div class="form-col">
                        <label for="last-name">LAST NAME</label>
                        <input id="last-name" name="last-name" type="text">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label for="email">EMAIL</label>
                        <input id="email" name="email" type="email"
                        pattern="^\w*(\-\w)?(\.\w*)?@\w*(-\w*)?\.\w{2,3}(\.\w{2,3})?$">
                    </div>

                    <div class="form-col">
                        <label for="phone-num">PHONE NUMBER</label>
                        <input id="phone-num" name="phone-num" type="tel">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label for="password">PASSWORD</label>
                        <input id="password" name="password" type="password"
                        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                        minlength="8" maxlength="30" required>
                    </div>

                    <div class="form-col">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input id="confirm-password" 
                        name="confirm-password" type="password" minlength="8"
                        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                        maxlength="30" required>
                    </div>
                </div>

            </form>

            <input type="submit" form="signup" 
                id="create" value="Create Account"/>
            <p>Already have an account? <a href="" id="login">Log in</a></p>
        </div>
    </body>
</html>
